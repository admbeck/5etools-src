name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"  # Every 6 hours
  workflow_dispatch:         # Allow manual execution

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork with upstream
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/merge-upstream \
            -f branch=main
        env:
          GH_TOKEN: ${{ github.token }}
